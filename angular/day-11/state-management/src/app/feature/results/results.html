<div class="result-card">
  <h2>Quiz Results</h2>

  <div class="result-item">
    <span>Total Points</span>
    <strong>{{ totalScore() }}</strong>
  </div>

  <div class="result-item">
    <span>User</span>
    <strong>{{ name() }}</strong>
  </div>

  <div class="result-item">
    <span>Email</span>
    <strong>{{ email() }}</strong>
  </div>

  <button class="primary-btn" (click)="restart()">Restart</button>
</div>
