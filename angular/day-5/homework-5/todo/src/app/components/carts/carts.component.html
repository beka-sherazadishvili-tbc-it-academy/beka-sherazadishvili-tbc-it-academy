<div class="products">
  <h1>Products</h1>

  <ul>
    <li *ngFor="let product of products">
      <img src="../../../assets/images/{{ product.img }}" />
      <div class="details">
        <span>{{ product.name }}</span>
        <span>${{ product.price }}</span>
      </div>
      <button (click)="addToCart(product)">Add to Cart</button>
    </li>
  </ul>
</div>

<hr />

<div class="cart-items" *ngIf="cartItems$ | async as cartItems; else empty">
  <div *ngFor="let item of cartItems">
    <h3>{{ item.name }} — {{ item.price }}$</h3>

    <div>
      <button (click)="decrement(item.id)">-</button>
      <span>{{ item.quantity }}</span>
      <button (click)="increment(item.id)">+</button>
    </div>
  </div>

  <h3>Total Quantity: {{ totalQuantity() }}</h3>
  <h3>Total Price: {{ totalPrice() }}$</h3>
  <button (click)="clearCart()">CheckOut</button>
</div>

<ng-template #empty>
  <p>Your cart is empty.</p>
</ng-template>
