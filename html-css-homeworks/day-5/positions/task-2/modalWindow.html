<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../../utils/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./modalWindow.css">
    <title>Modal Window</title>
</head>
<body>
    <div>
        <div>
            <div class="modal">
                <!-- close -->
                <div class="close">
                    <p>×</p>
                </div>

                <!-- new -->
                <div class="new">
                    <p>NEW</p>
                </div>

                <!-- body -->
                <div class="main-body">
                    <div class="title">
                        <h1>Modal Title</h1>
                    </div>

                    <div class="content">
                        <p>This is a modal window. It stays centered with a dark overlay.</p>
                    </div>

                    <div class="img-container">
                        <img src="../../../../assets/html-css/day-5/img.jpeg" alt="">
                        <div class="overlay">
                            <span>Positioned caption</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
