<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../../utils/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./positioning.css">
    <link rel="stylesheet" href="./main-positioning.css">
    <!-- <link rel="stylesheet" href="./main-positioning.css"> -->
    <title>Positioning Lab</title>
</head>
<body>
    <!-- header part -->
    <div aria-label="header" id="header_container" class="header-container">
        <div class="header-box">
            <div class="logo">
                <p>POSITIONING LAB</p>
            </div>

            <div class="navigation">
                <div class="navbar">
                    <div><p>Home</p></div>
                    <img src="../../../../assets/html-css/day-5/arrow.svg" alt="">
                    <div><p>Week 3</p></div>
                    <img src="../../../../assets/html-css/day-5/arrow.svg" alt="">
                    <div id="current_directory"><p>Hero Layout</p></div>
                </div>
            </div>
        </div>
    </div>

    <!-- nav box part -->
    <div id="nav_box" class="nav-box">
        <!-- arrows -->
        <div id="left_arrow" class="arrow">
            <img src="../../../../assets/html-css/day-5/left.svg" alt="">
        </div>

        <div id="right_arrow" class="arrow">
            <img src="../../../../assets/html-css/day-5/right.svg" alt="">
        </div>

        <!-- banner part -->
        <div id="banner_container" class="banner-container">
            <div class="banner-header">
                <div class="banner-header-sub-container">
                    <p>SPORT · STRENGTH</p>
                </div>
            </div>

            <div class="banner-content">
                <h1>Mast<span class="custom_padding">er</span>ing</h1>
                <h1><span class="custom_style">CSS</span> Positions</h1>
            </div>
        </div>

        <!-- comment part -->
        <div class="banner-comment">
            <p>Recreate this hero exactly: layered overlay, <span>corner ribbon, floating</span></p>
            <p>stats, centered CTA, and arrow controls.</p>
        </div>

        <!-- button -->
         <div class="button">
            <p>ENTER WORKOUTS</p>
         </div>

         <div class="brief">
            <p>BRIEF · 2025</p>
         </div>

        <div class="hidden"></div>
    </div>

    <!-- main part -->
    <div id="main_container" class="main-container" aria-label="main">

        <div class="main-box">
             <div class="sticky-box"></div>
             <div>
                
             </div>
        </div>
    </div>
</body>
</html>
